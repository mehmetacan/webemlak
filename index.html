<html lang="tr"><head><meta charset="utf-8">

<title>Asya Emlak</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a0f1c;--pn:#121a2e;--ln:#26324f;--tx:#e9edf5;--mu:#8d98b3;--au:#d9b45a;--au2:#f3dc9a;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f4f1ea;--pn:#fff;--ln:#ddd6c4;--tx:#1b2236;--mu:#66708a;--au:#a67c1b;--au2:#7a5a10;color-scheme:light}}
:root[data-theme="dark"]{--bg:#0a0f1c}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.55 Sora,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
nav{display:flex;gap:18px;align-items:center;padding:12px 24px;border-bottom:1px solid var(--ln);flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
nav img{height:44px}nav .sp{flex:1}nav a.l{color:var(--mu)}nav a.l:hover,nav a.on{color:var(--au)}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:9px 12px}
textarea{width:100%;min-height:90px}
button{cursor:pointer}button.pr{background:linear-gradient(135deg,var(--au2),var(--au));color:#1b1405;border:0;font-weight:600}
button.dg{color:#ff8b8b}:focus-visible{outline:2px solid var(--au);outline-offset:2px}
.w{max-width:1120px;margin:0 auto;padding:24px}
.hero{padding:56px 24px 40px;background:linear-gradient(var(--bg),transparent 40%),repeating-linear-gradient(0deg,transparent 0 39px,var(--ln) 39px 40px),repeating-linear-gradient(90deg,transparent 0 39px,var(--ln) 39px 40px);border-bottom:1px solid var(--ln)}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.08;margin:0 0 12px;font-weight:700;max-width:14em;letter-spacing:-.02em}
.hero p{color:var(--mu);max-width:38em;margin:0 0 24px}
.sr{display:flex;gap:10px;flex-wrap:wrap;background:var(--pn);border:1px solid var(--ln);padding:12px;border-radius:14px;max-width:760px}
.sr input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.cd{background:var(--pn);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:block}
.cd:hover{border-color:var(--au)}.cd .b{padding:14px}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,hsl(var(--h) 38% 24%),hsl(calc(var(--h) + 35) 45% 11%));background-size:cover;background-position:center;display:grid;place-items:center;color:#ffffff55}
.ph svg{width:46px;height:46px}
.pc{font-weight:700;color:var(--au);font-size:18px}.mu{color:var(--mu);font-size:13px}
.tg{display:inline-block;font-size:12px;padding:2px 9px;border:1px solid var(--au);color:var(--au);border-radius:99px}
.sp2{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--mu);font-size:13px}
.dt{display:grid;grid-template-columns:1.5fr 1fr;gap:24px}@media(max-width:800px){.dt{grid-template-columns:1fr}}
.th{display:flex;gap:8px;margin-top:8px}.th .ph{width:84px;border-radius:8px;cursor:pointer;border:2px solid transparent}.th .ph.a{border-color:var(--au)}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:18px}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--ln);text-align:left;font-size:14px}
.tw{overflow-x:auto}.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:12px}.fm label{display:grid;gap:4px;font-size:13px;color:var(--mu)}
.tb{display:flex;gap:8px;margin-bottom:16px}.tb button.on{border-color:var(--au);color:var(--au)}
.ok{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--au);color:#1b1405;padding:10px 18px;border-radius:99px;font-weight:600}
h2{margin:0 0 14px;font-weight:600;letter-spacing:-.01em}
nav{backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 72%,transparent)}
.hero{position:relative;padding:92px 24px 64px;background:radial-gradient(60% 90% at 85% 0%,color-mix(in srgb,var(--au) 26%,transparent),transparent 70%),radial-gradient(50% 70% at 0% 100%,#3b4f9055,transparent 70%),var(--bg)}
.hero h1{font-size:clamp(34px,6vw,68px);font-weight:300;letter-spacing:-.035em;max-width:13em}
.st{display:flex;gap:40px;margin-top:40px;flex-wrap:wrap}.st b{display:block;font-size:32px;font-weight:300;color:var(--au)}
.cd{border-radius:18px;transition:transform .2s,border-color .2s}.cd:hover{transform:translateY(-3px)}
.ly{display:grid;grid-template-columns:1fr 290px;gap:22px}.fp{position:sticky;top:88px;align-self:start}.fp .fm{margin:0}.fp .fm>*{grid-column:1/-1}
@media(max-width:860px){.ly{grid-template-columns:1fr}.fp{order:-1;position:static}}
.tp{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ck{display:flex;gap:8px;flex-wrap:wrap}.ck label{display:flex;flex-direction:row;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--ln);border-radius:8px;color:var(--tx);cursor:pointer}.ck input{width:auto;padding:0}
.ft{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px}.ft h3{margin:0 0 6px;color:var(--au);font-weight:600}
.cta{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:32px;background:radial-gradient(70% 160% at 100% 0%,color-mix(in srgb,var(--au) 22%,transparent),transparent),var(--pn)}
.cg{display:grid;grid-template-columns:1fr 1.5fr;gap:22px}@media(max-width:800px){.cg{grid-template-columns:1fr}}.mp{width:100%;height:360px;border:0;border-radius:14px;background:var(--pn)}
footer{border-top:1px solid var(--ln);padding:28px 24px;color:var(--mu);font-size:13px;display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between;margin-top:32px}footer a:hover{color:var(--au)}
.fm>*,.fm label{min-width:0}input,select{width:100%;min-width:0}nav select,.sr input,.sr select{width:auto}
.fp h4{margin:16px 0 6px;font-size:13px;color:var(--mu);font-weight:600}.ck label{position:relative}.ck input{position:absolute;opacity:0;pointer-events:none}.ck label:has(input:checked){border-color:var(--au);color:var(--au);background:color-mix(in srgb,var(--au) 12%,transparent)}.ck label:has(input:focus-visible){outline:2px solid var(--au)}
@keyframes fl{50%{transform:translateY(-14px)}}@keyframes dr{50%{transform:translate(30px,-20px) scale(1.15)}}@keyframes mq{to{transform:translateX(-50%)}}
.hero{overflow:hidden}.ob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;animation:dr 14s ease-in-out infinite;pointer-events:none}.o1{width:340px;height:340px;background:var(--au);right:8%;top:-60px}.o2{width:300px;height:300px;background:#4a63c9;left:-60px;bottom:-80px;animation-delay:-6s}
.hg{position:relative;z-index:1;display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}@media(max-width:860px){.hg{grid-template-columns:1fr}.vis{display:none}}
.vis{position:relative;height:390px}.vc{position:absolute;width:240px;background:color-mix(in srgb,var(--pn) 80%,transparent);backdrop-filter:blur(10px);border:1px solid var(--ln);border-radius:16px;overflow:hidden;animation:fl 6s ease-in-out infinite;box-shadow:0 20px 50px #0005}.vc .b{padding:10px 12px;font-size:13px}.vc .ph{aspect-ratio:16/9}.v1{left:0;top:10px}.v2{right:0;top:130px;animation-delay:-2s}.v3{left:50px;bottom:0;animation-delay:-4s}
.mq{overflow:hidden;border-bottom:1px solid var(--ln);color:var(--mu);padding:12px 0;white-space:nowrap}.mq div{display:inline-block;animation:mq 32s linear infinite}.mq span{margin:0 26px}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}.cd .ph{transition:transform .5s}.cd:hover .ph{transform:scale(1.06)}
.wz{max-width:560px;margin:0 auto;padding:16px 16px 120px}.pg{height:4px;background:var(--ln);border-radius:4px;overflow:hidden;margin:8px 0 4px}.pg i{display:block;height:100%;background:linear-gradient(90deg,var(--au2),var(--au));transition:width .35s}
.sh{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mu)}.wz h2{font-size:24px;margin:20px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:10px 15px;border-radius:99px;border:1px solid var(--ln);background:var(--pn);font-size:15px}.chip.on{border-color:var(--au);color:var(--au);background:color-mix(in srgb,var(--au) 14%,var(--pn));font-weight:600}
.pb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.pb label{position:relative;display:grid;place-items:center;gap:8px;padding:26px 10px;border:1.5px dashed var(--ln);border-radius:16px;background:var(--pn);cursor:pointer;font-weight:600;text-align:center}.pb label:active{border-color:var(--au)}.pb svg{width:34px;height:34px;color:var(--au)}.pb input{position:absolute;opacity:0;width:1px;height:1px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.tgrid .t{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background-size:cover;background-position:center;background-color:var(--pn)}.tgrid .t b{position:absolute;left:6px;top:6px;font-size:11px;background:var(--au);color:#1b1405;padding:2px 8px;border-radius:99px}.tgrid .t button{position:absolute;padding:5px 9px;border-radius:99px;background:#000b;color:#fff;border:0;font-size:12px}.t .x{right:6px;top:6px}.t .cv{left:6px;bottom:6px}
.fld{margin-top:20px}.fld>span{display:block;font-size:13px;color:var(--mu);margin-bottom:8px;font-weight:600}.fld input,.fld textarea{font-size:16px;padding:13px 14px;border-radius:12px}
.stp{display:flex;align-items:center;border:1px solid var(--ln);border-radius:12px;overflow:hidden;width:max-content;background:var(--pn)}.stp button{border:0;border-radius:0;width:52px;font-size:22px;padding:8px}.stp output{min-width:84px;text-align:center;font-size:16px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--ln);display:flex;gap:10px;z-index:6}.bar button{flex:1;padding:15px;font-size:16px;border-radius:12px}.bar .pr{flex:2}
.ml{display:grid;gap:12px;margin-top:14px}.mi{display:flex;gap:12px;align-items:center;background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:10px}.mi .ph{width:88px;flex:none;border-radius:10px}.mi .in{flex:1;min-width:0}.mi .in>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mi button{padding:7px 11px;font-size:13px}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));padding:16px 22px;border-radius:99px;box-shadow:0 10px 30px #0006;z-index:6;font-size:16px}
.err{color:#ff8b8b;font-size:14px;margin-top:12px;min-height:1.2em}.sum{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:14px;margin:0}.sum dt{color:var(--mu)}.sum dd{margin:0}
.dbn{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;border-color:var(--au)}
body:has(.bar) footer{display:none}
@media(max-width:600px){nav{gap:14px;padding:10px 16px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;white-space:nowrap}nav::-webkit-scrollbar{display:none}nav .sp{display:none}nav img{height:32px}nav label.mu{font-size:0}nav label.mu select{font-size:13px;padding:7px 8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
.ba{display:inline-block;padding:10px 18px;border-radius:8px;background:linear-gradient(135deg,var(--au2),var(--au));color:#1b1405;font-weight:600}

const f=$('#ff');f.oninput=f.onchange=()=>{const d=new FormData(f),t=d.getAll('tip');F={...F,tip:t.length==1?t[0]:'',tur:d.get('tur'),il:d.get('il'),q:d.get('q'),pmin:d.get('pmin'),pmax:d.get('pmax'),amin:d.get('amin'),amax:d.get('amax'),oda:d.getAll('oda'),yas:d.get('yas'),kat:d.get('kat'),as:d.get('as'),oz:d.getAll('oz')};rs()};$('#fc').onclick=()=>{R();ilanlar()};rs()}
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12}),rv=()=>document.querySelectorAll('.rv').forEach(e=>io.observe(e)),cu=()=>document.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n;let i=0;const s=()=>{e.textContent=Math.round(t*++i/36);if(i<36)requestAnimationFrame(s)};s()});

$('#app').innerHTML=`<section class="hero"><i class="ob o1"></i><i class="ob o2"></i><div class="hg"><div><h1>${esc(SS.hero)}</h1><p>${esc(SS.sub)}</p><form class="sr" id="hs"><select name="tip"><option value="">Satılık ve kiralık</option><option>Satılık</option><option>Kiralık</option></select><input name="q" placeholder="Şehir, ilçe veya kelime"><button class="pr">İlanları göster</button></form><div class="st">${n('güncel ilan',a.length)}${n('satılık',a.filter(l=>l.tip=='Satılık').length)}${n('kiralık',a.filter(l=>l.tip=='Kiralık').length)}${n('danışman',U.filter(u=>u.rol=='Danışman'&&u.on).length)}</div></div><div class="vis">${vc('v1',a[0])}${vc('v2',a[1])}${vc('v3',a[2])}</div></div></section><div class="mq"><div>${ds}${ds}</div></div><div class="w rv"><h2>Öne çıkan ilanlar</h2><div class="grid">${a.slice(0,3).map(card).join('')}</div><p><a class="tg" href="#ilanlar">Tüm ilanları gör</a></p></div><div class="w rv"><h2>Neden Asya Emlak?</h2><div class="ft"><div class="pn"><h3>Kontrol edilmiş ilanlar</h3><span class="mu">Her ilan yönetici denetiminden geçer, gerektiğinde yayından kaldırılır.</span></div><div class="pn"><h3>Doğrudan danışman</h3><span class="mu">İlan sahibine telefon, e-posta veya WhatsApp ile tek adımda ulaşın.</span></div><div class="pn"><h3>Net filtreler</h3><span class="mu">Fiyat, alan, oda, kat, bina yaşı ve özelliklerle aradığınızı daraltın.</span></div></div></div><div class="w rv"><div class="pn cta"><div><h2 style="margin:0">Mülkünüzü satmak veya kiralamak mı istiyorsunuz?</h2><span class="mu">Danışmanlarımızla görüşün, size uygun yol haritasını birlikte çıkaralım.</span></div><a class="ba" href="#iletisim">Bize ulaşın</a></div></div>`;

function settings(){if(role!='m')return $('#app').innerHTML='<div class="w"><p>Bu sayfa yalnızca yöneticiler içindir.</p></div>';const f=(k,l)=>`<label>${l}<input name="${k}" value="${esc(SS[k])}"></label>`;

$('#sf2').onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);Object.keys(SS).forEach(k=>SS[k]=d.get(k));save();toast('Ayarlar kaydedildi')}}
const CAM='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',GAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>';
const ARSA=t=>t=='Tarla'||t=='Parsel',STEPS=['Başlık','Fotoğraflar','Bilgiler','Açıklama'],WT=['Daire','Müstakil','Villa','Dubleks','Tarla','Parsel'];
let W=null,ws=0;
const blank=()=>({t:'',tip:'Satılık',tur:'Daire',p:[],f:'',m2:'',il:'',ilce:'',oda:'2+1',kat:1,yas:0,as:1,oz:[],d:''});
const gd=()=>{try{return JSON.parse(localStorage.getItem('asya-draft')||'null')}catch(e){return null}},draft=()=>{try{localStorage.setItem('asya-draft',JSON.stringify({W,ws}))}catch(e){}},nod=()=>{try{localStorage.removeItem('asya-draft')}catch(e){}};
const shrink=f=>new Promise(r=>{const fr=new FileReader;fr.onload=()=>{const im=new Image;im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.78))};im.onerror=()=>r(null);im.src=fr.result};fr.onerror=()=>r(null);fr.readAsDataURL(f)});
const ch=(k,a)=>`<div class="chips">${a.map(v=>`<button type="button" class="chip ${W[k]==v?'on':''}" data-k="${k}" data-v="${esc(v)}">${esc(v)}</button>`).join('')}</div>`;
const kv=(k,v)=>k=='kat'?(v<0?'Bodrum '+(-v):v==0?'Zemin':v+'. kat'):v==0?'Yeni':v+' yaş';
const stp=(k,a,b)=>`<div class="stp"><button type="button" data-sk="${k}" data-sd="-1" data-a="${a}" data-b="${b}" aria-label="Azalt">−</button><output id="o-${k}">${kv(k,W[k])}</output><button type="button" data-sk="${k}" data-sd="1" data-a="${a}" data-b="${b}" aria-label="Arttır">+</button></div>`;
const wsync=()=>{const g=i=>document.getElementById(i);if(g('w-t'))W.t=g('w-t').value;if(g('w-f'))W.f=+g('w-f').value.replace(/\D/g,'')||'';if(g('w-m2'))W.m2=+g('w-m2').value.replace(/\D/g,'')||'';if(g('w-il'))W.il=g('w-il').value.trim();if(g('w-ilce'))W.ilce=g('w-ilce').value.trim();if(g('w-d'))W.d=g('w-d').value};
function panel(){if(role=='v')return $('#app').innerHTML='<div class="w"><p>Bu sayfa için giriş gerekir. Üstteki menüden Danışman veya Yönetici seçin.</p></div>';if(W)return wiz();
const m=L.filter(l=>l.u==1),dr=gd();
$('#app').innerHTML=`<div class="wz"><h2>İlanlarım</h2><span class="mu">${m.length} ilan · ${m.filter(l=>l.on).length} yayında</span>${dr&&dr.W?`<div class="pn dbn"><span>Yarım kalan ilan: <b>${esc(dr.W.t||'Başlıksız')}</b></span><span><button id="dg" class="pr">Devam et</button> <button id="dx" class="dg">Sil</button></span></div>`:''}<div class="ml">${m.map(l=>`<div class="mi">${ph(l.p[0])}<div class="in"><div><b>${esc(l.t)}</b></div><div class="pc" style="font-size:15px">${TL(l.f)}</div><div class="mu">${esc(l.ilce)}, ${esc(l.il)} · ${l.on?'Yayında':'Gizli'}</div><div style="display:flex;gap:6px;margin-top:8px"><button data-e="${l.id}">Düzenle</button><button data-g="${l.id}">Gör</button><button class="dg" data-d="${l.id}">Sil</button></div></div></div>`).join('')||'<div class="pn mu">Henüz ilanınız yok. Sağ alttaki butonla ilk ilanınızı ekleyin.</div>'}</div></div><button class="pr fab" id="nw">+ Yeni ilan</button>`;
$('#nw').onclick=()=>{W=blank();ws=0;wiz()};
if($('#dg'))$('#dg').onclick=()=>{W=dr.W;ws=dr.ws||0;wiz()};if($('#dx'))$('#dx').onclick=()=>{nod();panel()};
document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>{const l=L.find(x=>x.id==b.dataset.e);W={...blank(),...JSON.parse(JSON.stringify(l)),_edit:l.id};W.p=W.p.filter(x=>typeof x=='string');ws=0;wiz()});
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>go('#ilan-'+b.dataset.g));
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(!confirm('Bu ilan silinsin mi?'))return;L=L.filter(x=>x.id!=b.dataset.d);save();panel()})}
function wiz(){const s=ws,ar=ARSA(W.tur);let body='';
if(s==0)body=`<h2>İlan başlığı</h2><p class="mu" style="margin:0">Kısa ve dikkat çekici olsun. Örnek: Deniz manzaralı 3+1 daire</p><div class="fld"><input id="w-t" maxlength="80" placeholder="İlan başlığı" value="${esc(W.t)}" enterkeyhint="next"><div class="mu" style="text-align:right;font-size:12px;margin-top:4px"><span id="w-c">${W.t.length}</span>/80</div></div><div class="fld"><span>İlan tipi</span>${ch('tip',['Satılık','Kiralık'])}</div>`;
if(s==1)body=`<h2>Fotoğraflar</h2><p class="mu" style="margin:0">En fazla 15 fotoğraf. İlk fotoğraf vitrin görseli olur.</p><div class="pb"><label>${CAM}Kamerayla çek<input type="file" accept="image/*" capture="environment" id="w-cam"></label><label>${GAL}Galeriden seç<input type="file" accept="image/*" multiple id="w-gal"></label></div><div id="w-st" class="mu" style="margin-top:12px">${W.p.length} / 15 fotoğraf</div><div class="tgrid">${W.p.map((x,i)=>`<div class="t" style="background-image:url(${x})">${i==0?'<b>Vitrin</b>':''}<button type="button" class="x" data-rm="${i}" aria-label="Fotoğrafı kaldır">✕</button>${i?`<button type="button" class="cv" data-cv="${i}">Vitrin yap</button>`:''}</div>`).join('')}</div>`;
if(s==2)body=`<h2>İlan bilgileri</h2><div class="fld"><span>Emlak türü</span>${ch('tur',WT)}</div><div class="fld"><span>Fiyat (₺)${W.tip=='Kiralık'?' / aylık':''}</span><input id="w-f" inputmode="numeric" placeholder="Örn. 2.500.000" value="${W.f?Number(W.f).toLocaleString('tr-TR'):''}"></div><div class="fld"><span>${ar?'Arsa alanı':'Brüt alan'} (m²)</span><input id="w-m2" inputmode="numeric" placeholder="Örn. 120" value="${W.m2}"></div><div class="fld"><span>Konum</span><div class="rg"><input id="w-il" placeholder="Şehir" list="w-ils" value="${esc(W.il)}"><input id="w-ilce" placeholder="İlçe" value="${esc(W.ilce)}"></div><datalist id="w-ils">${[...new Set(['Antalya','İstanbul','Ankara','İzmir','Bursa','Muğla','Mersin','Aydın',...L.map(l=>l.il)])].map(x=>`<option value="${esc(x)}">`).join('')}</datalist></div>`+(ar?'':`<div class="fld"><span>Oda sayısı</span>${ch('oda',['1+0','1+1','2+1','3+1','4+1','5+1'])}</div><div class="fld"><span>Bulunduğu kat</span>${stp('kat',-2,60)}</div><div class="fld"><span>Bina yaşı</span>${stp('yas',0,100)}</div><div class="fld"><span>Asansör</span><div class="chips"><button type="button" class="chip ${W.as?'on':''}" data-as="1">Var</button><button type="button" class="chip ${W.as?'':'on'}" data-as="0">Yok</button></div></div><div class="fld"><span>Özellikler</span><div class="chips">${OZ.map(o=>`<button type="button" class="chip ${W.oz.includes(o)?'on':''}" data-oz="${o}">${o}</button>`).join('')}</div></div>`);
if(s==3)body=`<h2>Açıklama</h2><p class="mu" style="margin:0">Evin öne çıkan yönlerini, çevresini ve ulaşımı anlatın.</p><div class="fld"><textarea id="w-d" rows="8" maxlength="3000" placeholder="Örn. Güney cephe, yeni tadilatlı, okula 5 dakika yürüme mesafesinde...">${esc(W.d)}</textarea></div><div class="pn" style="margin-top:18px"><h3 style="margin:0 0 12px">Özet</h3><dl class="sum"><dt>Başlık</dt><dd>${esc(W.t)}</dd><dt>Tip</dt><dd>${W.tip} · ${esc(W.tur)}</dd><dt>Fiyat</dt><dd>${W.f?TL(W.f):'-'}</dd><dt>Alan</dt><dd>${W.m2||'-'} m²</dd><dt>Konum</dt><dd>${esc(W.ilce)}, ${esc(W.il)}</dd>${ar?'':`<dt>Oda</dt><dd>${W.oda}</dd><dt>Kat</dt><dd>${kv('kat',W.kat)}</dd>`}<dt>Fotoğraf</dt><dd>${W.p.length} adet</dd></dl></div>`;
$('#app').innerHTML=`<div class="wz"><div class="sh"><span>Adım ${s+1}/4 · ${STEPS[s]}${W._edit?' · Düzenleme':''}</span><button type="button" id="w-x" style="padding:6px 12px;font-size:13px">Kapat</button></div><div class="pg"><i style="width:${(s+1)*25}%"></i></div>${body}<div class="err" id="w-e" role="alert"></div></div><div class="bar">${s?'<button type="button" id="w-b">Geri</button>':''}<button type="button" class="pr" id="w-n">${s==3?(W._edit?'Kaydet':'İlanı yayınla'):'Devam'}</button></div>`;
const A=$('#app'),er=t=>{$('#w-e').textContent=t},re=()=>{wsync();draft();wiz()};
A.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{wsync();W[b.dataset.k]=b.dataset.v;draft();wiz()});

A.querySelectorAll('[data-oz]').forEach(b=>b.onclick=()=>{wsync();const o=b.dataset.oz;W.oz=W.oz.includes(o)?W.oz.filter(x=>x!=o):[...W.oz,o];draft();wiz()});
A.querySelectorAll('[data-sk]').forEach(b=>b.onclick=()=>{const k=b.dataset.sk;W[k]=Math.max(+b.dataset.a,Math.min(+b.dataset.b,(+W[k]||0)+ +b.dataset.sd));$('#o-'+k).textContent=kv(k,W[k]);draft()});

$('#w-x').onclick=()=>{wsync();if(!W._edit){draft();toast('Taslak kaydedildi')}W=null;panel()};
if($('#w-b'))$('#w-b').onclick=()=>{wsync();ws--;draft();wiz();scrollTo(0,0)};
$('#w-n').onclick=()=>{wsync();
if(s==0&&W.t.trim().length<5)return er('Başlık en az 5 karakter olmalı.');

if(s==2){if(!W.f)return er('Fiyatı girin.');if(!W.m2)return er('Alanı (m²) girin.');if(!W.il||!W.ilce)return er('Şehir ve ilçeyi girin.')}
if(s<3){ws++;draft();wiz();scrollTo(0,0);return}
const o=W._edit?L.find(x=>x.id==W._edit):{id:Date.now(),u:1,on:1};['t','tip','tur','p','f','m2','il','ilce','oda','kat','yas','as','oz','d'].forEach(k=>o[k]=W[k]);o.t=o.t.trim();if(ARSA(o.tur)){o.oda='-';o.kat=0;o.as=0;o.yas=0}if(!o.d)o.d='Detaylı bilgi için danışmanımızla iletişime geçin.';
const nw=!W._edit;if(nw)L.unshift(o);if(!save()){if(nw)L.shift();return er('Kaydedilemedi: tarayıcı alanı doldu. Birkaç fotoğrafı kaldırıp tekrar deneyin.')}
nod();W=null;toast(nw?'İlan yayınlandı':'Kaydedildi');go('#ilan-'+o.id)}}
let cur=(location.hash.slice(1)||'ana');const go=h=>{cur=String(h).replace(/^#/,'')||'ana';try{history.replaceState(null,'','#'+cur)}catch(e){}route()};
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="#"]');if(!a)return;e.preventDefault();go(a.getAttribute('href'))});

addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'ana';if(h!==cur){cur=h;route()}});route();
</script></body></html>
